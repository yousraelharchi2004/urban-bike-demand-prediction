name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install flake8 black isort
      - name: Check formatting with black
        run: black --check --diff app/ tests/ train_unified_pipeline.py
      - name: Check import order with isort
        run: isort --check-only --diff app/ tests/
      - name: Lint with flake8
        run: flake8 app/ tests/ --max-line-length=120 --ignore=E501,W503,E402

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest tests/ -v --tb=short

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: pip install bandit safety
      - name: Security scan with bandit
        run: bandit -r app/ -ll --skip B101
      - name: Check dependencies with safety
        run: safety check -r requirements.txt || true
