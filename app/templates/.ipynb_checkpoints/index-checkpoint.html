<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bike Rental Prediction</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Bike Rental Demand Prediction</h1>
        
        <form id="prediction-form">
            <label for="hour">Hour:</label>
            <input type="number" id="hour" name="hour" required>

            <label for="temperature">Temperature (°C):</label>
            <input type="number" id="temperature" name="temperature" required>

            <label for="humidity">Humidity (%):</label>
            <input type="number" id="humidity" name="humidity" required>

            <label for="windspeed">Wind Speed (m/s):</label>
            <input type="number" id="windspeed" name="windspeed" required>

            <label for="visibility">Visibility (10m):</label>
            <input type="number" id="visibility" name="visibility" required>

            <label for="seasons">Seasons:</label>
            <select id="seasons" name="seasons">
                <option value="Spring">Spring</option>
                <option value="Summer">Summer</option>
                <option value="Winter">Winter</option>
            </select>

            <button type="submit">Predict</button>
        </form>

        <div id="result">
            <h3>Prediction:</h3>
            <p id="prediction-result">Please enter the data and click Predict.</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
